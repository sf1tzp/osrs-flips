# PostgreSQL configuration tuned for 4GB dedicated TimescaleDB machine
# Mount: -v ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
# Command: postgres -c config_file=/etc/postgresql/postgresql.conf

# =============================================================================
# Memory
# =============================================================================
shared_buffers = '1GB'              # 25% of 4GB RAM (default: 128MB)
work_mem = '16MB'                   # Per-sort/hash; prevents disk spill (default: 4MB)
effective_cache_size = '2560MB'     # Planner hint: OS cache + shared_buffers
maintenance_work_mem = '256MB'      # VACUUM, index builds, retention drops (default: 64MB)

# =============================================================================
# Connections
# =============================================================================
max_connections = 50                # Only collector pool (25) + pgAdmin (default: 100)

# =============================================================================
# WAL
# =============================================================================
wal_buffers = '16MB'                # Adequate for 1GB shared_buffers
min_wal_size = '256MB'              # Reduce WAL recycling (default: 80MB)
max_wal_size = '1GB'                # Cap WAL disk usage

# =============================================================================
# Planner / I/O (SSD-optimized)
# =============================================================================
random_page_cost = 1.1              # SSD: nearly same as seq (default: 4.0)
effective_io_concurrency = 200      # SSD: high concurrency (default: 1)

# =============================================================================
# Autovacuum (tuned for hypertables with frequent inserts)
# =============================================================================
autovacuum_vacuum_scale_factor = 0.05   # Vacuum sooner (default: 0.2)
autovacuum_analyze_scale_factor = 0.02  # Fresher planner stats (default: 0.1)

# =============================================================================
# Workers (TimescaleDB)
# =============================================================================
max_worker_processes = 16           # TimescaleDB background workers need headroom
timescaledb.max_background_workers = 8  # Compression, retention jobs

# =============================================================================
# Logging (structured JSON for Fluent Bit / Loki)
# =============================================================================
log_destination = 'jsonlog'         # PG15+ structured JSON to stderr
logging_collector = off             # Container runtime captures stderr
log_min_duration_statement = 1000   # Log slow queries > 1s (ms)
log_checkpoints = on                # Track checkpoint activity
log_lock_waits = on                 # Detect lock contention
log_temp_files = 0                  # Alert on any disk spill (bytes; 0 = all)
log_autovacuum_min_duration = 500   # Track autovacuum performance (ms)
log_connections = off               # Too noisy with connection pooling
log_disconnections = off
