services:
  collector:
    container_name: osrs-flips-collector
    restart: unless-stopped
    image: osrs-flips-collector:latest
    env_file: [.env]

    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OSRS_API_USER_AGENT=${OSRS_API_USER_AGENT}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-60}
    command:
      - ./osrs-flips-collector
      - -sync-timestamps-per-cycle=300
      - -enable-signals
      # - -sync-min-item-threshold=5000

    # Health check
    healthcheck:
      test: ["CMD", "pgrep", "osrs-flips-collector"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - caddy_network

  ui:
    container_name: osrs-flips-ui
    restart: unless-stopped
    image: osrs-flips-ui:latest
    env_file: [.env]

    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OSRS_API_USER_AGENT=${OSRS_API_USER_AGENT:-osrs-flips}

    networks:
      - caddy_network

networks:
  caddy_network:
    external: true

